{% extends "tasks/base.html" %}
{% block title %}Архивировать проект — TaskFlow{% endblock %}
{% block content %}

<div class="form-page">
    <div class="form-card confirm-card">
        <div class="confirm-icon">⚠</div>
        <h2>Архивировать проект?</h2>
        <p>Проект <strong>"{{ project.name }}"</strong> и его задачи будут скрыты из рабочих списков, но данные сохранятся в базе.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions confirm-actions">
                <button type="submit" class="btn-danger">Архивировать</button>
                <a href="{% url 'project_detail' project.pk %}" class="btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
