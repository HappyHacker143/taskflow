{% extends "tasks/base.html" %}
{% block title %}Архивировать задачу — TaskFlow{% endblock %}
{% block content %}

<div class="form-page">
    <div class="form-card confirm-card">
        <div class="confirm-icon">⚠</div>
        <h2>Архивировать задачу?</h2>
        <p>Задача <strong>"{{ task.title }}"</strong> будет скрыта из рабочих списков, но история сохранится.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions confirm-actions">
                <button type="submit" class="btn-danger">Архивировать</button>
                <a href="{% url 'task_detail' task.pk %}" class="btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
